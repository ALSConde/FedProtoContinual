[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "FedProtoContinual"
version = "0.0.5"
description = "Federated Learning With Prototype and Continual Learning"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.26.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch",
    "scipy",
    "torchvision",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "ALSConde"

[tool.flwr.app.components]
serverapp = "src.server.Server_app:app"
clientapp = "src.client.Client_app:app"

[tool.flwr.app.config]
# --- Federation config ---
num-server-rounds = 150
fraction-evaluate = 1.0
local-epochs = 3
learning-rate = 0.001
training-scenario = "federated"
dirichlet-mode = "static"
partition-mode = "subject"
val-split = "recording"
server-eval-subjects = "6,7,8"
# --- Model config ---
input-dim = 6
batch-size = 32
hidden-dim = 64
d-hat-global = 16
d-hat-local = 8
tau=250
# --- Dataset config ---
data-root = "./storage/utd_mhad"
window-size = 60
stride = 30
dirichlet-alpha = 0.1
# --- Expansion config ---
theta-exp=0.04
a-max = 3
# theta-alpha = 0.30
theta-alpha = 0.15
candidacy-patience = 3
candidacy-cooldown = 5
candidacy-quorum = 0.5
vote-adapt-steps = 20
vote-margin = 0.001
vote-adapt-lr = 0.001
# --- MoFe vote / leave-one-out pruning (vote-mode = "legacy" keeps the old protocol) ---
vote-mode = "mofe"
vote-loss-margin = 0.01
vote-z = 1.0
prune-enabled = true
prune-margin = 0.01
prune-patience = 5
loo-ema = 0.7
incorporation-monitor-rounds = 3
incorporation-degrade-tolerance = 0.05
incorporation-baseline-window = 3
incorp_status="true"
# --- Knowledge Distillation config ---
kd-mode="kl"
lambda-kd=1.0
kd-temperature=2.0
kd-refresh-rounds=10
lambda-proto=1.0
# --- Continual config
num-classes-total = 27
classes-per-step = 3
rounds-per-step = 10
eval-batch-size = 16
# --- ablation flags (see src/utils/ablation.py) ---
fl-algorithm = "fedavg"
proximal-mu = 0.01
use-local-adapter = true
enable-expansion = true
enable-incorporation = true
enable-kd = true
report-window = 5
# --- federation size guards (centralized baseline = 1 node) ---
min-nodes = 2
expected-nodes = 0
output-dir = "outputs/default_run"
seed = 0