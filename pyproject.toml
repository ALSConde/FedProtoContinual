[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "FedProtoContinual"
version = "0.0.4"
description = "Federated Learning With Prototype and Continual Learning"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.26.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch",
    "scipy",
    "torchvision",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "ALSConde"

[tool.flwr.app.components]
serverapp = "src.server.Server_app:app"
clientapp = "src.client.Client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
fraction-evaluate = 1.0
local-epochs = 1
learning-rate = 0.001
input-dim = 6
batch-size = 32
hidden-dim = 64
d-hat-global = 16
d-hat-local = 8
data-root = "./storage/utd_mhad"
window-size = 60
stride = 30
dirichlet-alpha = 0.1
theta-exp=0.3
lambda-proto=1.0
lambda-kd=1.0
kd-mode="kl"
kd-temperature=2.0
training-scenario = "class-incremental"
dirichlet-mode = "static"
partition-mode = "subject"
server-eval-subjects = "6,7,8"
num-classes-total = 27
classes-per-step = 3
rounds-per-step = 6
eval-batch-size = 16
a-max = 3
theta-alpha = 0.30
candidacy-patience = 3
candidacy-cooldown = 5
candidacy-quorum = 0.5
vote-adapt-steps = 20
vote-margin = 0.001
incorporation-monitor-rounds = 3
incorporation-degrade-tolerance = 0.002
incorp_status="true"
output-dir = "outputs/default_run"
seed = 0