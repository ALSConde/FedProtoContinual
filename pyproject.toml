[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "FedProtoContinual"
version = "0.0.2"
description = "Federated Learning With Prototype and Continual Learning"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.26.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch",
    "scipy",
    "torchvision",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "ALSConde"

[tool.flwr.app.components]
serverapp = "src.server.Server_app:app"
clientapp = "src.client.Client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
fraction-evaluate = 1.0
local-epochs = 5
learning-rate = 0.001
input-dim = 6
batch-size = 16
hidden-dim = 64
d-hat-global = 16
d-hat-local = 8
data-root = "./storage/utd_mhad"
window-size = 60
stride = 30
dirichlet-alpha = 0.1
theta-exp=0.3
training-scenario = "class-incremental"
dirichlet-mode = "static"
num-classes = 27
classes-per-step = 6
rounds-per-step = 2

[superlink]
default = "local"

[superlink.local-poc]
address = "127.0.0.1:9093"
insecure = true

[superlink.local-custom-resources]
options.num-supernodes = 10
options.backend.client-resources.num-cpus = 1 # each ClientApp assumes to use 1 CPU (default is 2)
options.backend.client-resources.num-gpus = 0.25 # each ClientApp uses 25% of VRAM (default is 0.0)
